name: Agent image

# Tests the agent, then builds the robot container (linux/amd64 + linux/arm64) and publishes it
# to ghcr.io/liltaket/mowgli-connect-agent with provenance and an SBOM. Pushed images are signed
# by digest with cosign (Sigstore keyless, this workflow's GitHub OIDC identity) and get a signed
# SLSA provenance attestation. Robots run only images whose signature names this workflow file
# on main or an agent-v* tag (site/install.sh, update-policy), so this file, its triggers and
# the refs it runs on are the release trust boundary: see docs/updates.md. Actions are pinned by
# commit SHA, the QEMU and BuildKit images by digest.
#
# Never add workflow_call (or pull_request_target, workflow_run): the signing certificate of a
# reusable workflow names this file, so any workflow of this repository that called it, with its
# own triggers, refs and inputs, could make signatures that robots accept.
on:
  push:
    branches: [main]
    tags: ["agent-v*"]
    paths: [agent/**, .github/workflows/agent-image.yml]
  # Every pull request, not only agent changes: "Agent tests" is a required status check, and a
  # workflow skipped by a path filter never reports it, which would block the merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A release run is never cancelled between pushing and signing: robots refuse an unsigned image.
concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: go vet and test
        working-directory: agent
        run: |
          go vet ./...
          go test -race ./...
      - name: entrypoint syntax
        run: sh -n agent/entrypoint.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    # The only job with an OIDC token (id-token): it signs what it pushed.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only the tip of the ref is published. A re-run of an older run (same run number, older
      # commit) must not move :latest or sign an outdated build: robots compare the run number
      # (seq, signed below) and run the tag's digest.
      - name: Refuse a superseded commit
        if: github.event_name != 'pull_request'
        run: |
          tip=$(git ls-remote origin "$GITHUB_REF" "$GITHUB_REF^{}" |
            awk -v r="$GITHUB_REF" '$2 == r { s = $1 } $2 == r "^{}" { p = $1 } END { print (p != "" ? p : s) }')
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF is at ${tip:-nothing}, not $GITHUB_SHA: not publishing a superseded commit"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver-opts: image=docker.io/moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mowgli-connect-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=match,pattern=agent-v(.*),group=1
          labels: |
            org.opencontainers.image.title=Mowgli Connect agent
            org.opencontainers.image.description=Secure remote access to a MowgliNext robot's web GUI through Cloudflare Tunnel
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'
        with:
          cosign-release: v3.1.4 # the version robots verify with (update.sh)
      # seq, the release number robots use to refuse older releases: this workflow's run number,
      # which only grows (a re-run keeps its run's number). It is part of the signed payload.
      - name: Sign the image digest (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/mowgli-connect-agent@${{ steps.build.outputs.digest }}
          SEQ: ${{ github.run_number }}
        run: cosign sign --yes -a "seq=$SEQ" "$IMAGE"
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/mowgli-connect-agent
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
