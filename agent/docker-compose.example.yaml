# Add to MowgliNext's docker/stack-overrides.yaml (gitignored, merged by installer-stack and
# kept across updates). No MowgliNext file is edited. Do not add garden.mowgli.update.* labels.
# Nothing here verifies the image (site/install.sh does, see docs/updates.md): check the
# signature yourself and pin the digest it prints:
#   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/liltaket/mowgli-connect/\.github/workflows/agent-image\.yml@refs/(heads/main|tags/agent-v[0-9A-Za-z._+-]+)$' \
#     --certificate-github-workflow-repository liltaket/mowgli-connect ghcr.io/liltaket/mowgli-connect-agent:latest
services:
  mowgli-connect:
    image: ghcr.io/liltaket/mowgli-connect-agent@sha256:<verified digest> # amd64 + arm64; or build: ../mowgli-connect/agent
    container_name: mowgli-connect
    restart: unless-stopped
    # Own network namespace (not host): entrypoint.sh locks egress so cloudflared can reach only
    # the agent, whatever ingress the Cloudflare account pushes. The GUI (host network, :4006)
    # is reached through the Docker host gateway.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Only if the network's DNS server is slow or does not answer (every lookup then waits for a
    # timeout and the tunnel takes ~30 s to start): ask public resolvers first.
    # dns: ["1.1.1.1", "8.8.8.8"]
    environment:
      MC_RELAY_URL: https://connect.example.com
      MC_PROFILE: mowgli
      # MC_TUNNEL_MODE: quick     # free *.trycloudflare.com address, no domain (relay PROVISIONER=quick)
      # MC_ALLOW_TELEOP: "true"   # remote joystick; off by default, validate latency first
      # MC_SIMULATOR: "true"      # only for a simulated robot: shown with a Simulator badge on the relay
    volumes:
      - mowgli-connect-data:/data # robot.key + state.json (tunnel token). Back it up, keep it private.
    read_only: true
    cap_drop: [ALL]
    # NET_ADMIN: the entrypoint installs the egress rules (this container's namespace only), then
    # drops it. SETUID/SETGID/KILL: the agent starts and stops cloudflared as a separate,
    # capability-free user. Keep the default Compose network: it provides Docker's embedded DNS,
    # the only resolver cloudflared may use besides public ones.
    cap_add: [NET_ADMIN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]

volumes:
  mowgli-connect-data:
